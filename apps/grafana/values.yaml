# Grafana Helm Chart
# chart: grafana/grafana

image:
  repository: docker.m.daocloud.io/grafana/grafana
  tag: 11.0.0
  pullPolicy: IfNotPresent

# 管理账号
adminUser: admin
adminPassword: admin123

# 数据源（Prometheus）
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-operated:9090
        uid: PBFA97CFB590B2093
        isDefault: true

# Dashboard 预置
dashboards:
  default:
    prometheus-stats:
      gnetId: 2
      revision: 2
      datasource: Prometheus
    falco-alerts:
      # 需要通过 ConfigMap 方式预置，Helm 不支持直接上传 JSON

# 持久化（本地环境禁用）
persistence:
  enabled: false

# Service 类型
service:
  type: ClusterIP
  port: 3000

# 资源配置
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Ingress（本地环境不需要）
ingress:
  enabled: false

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "false"

# 初始化脚本
initChmod:
  enabled: false
