      {"apiVersion":"monitoring.coreos.com/v1","kind":"ServiceMonitor","metadata":{"annotations":{},"labels":{"release":"prometheus-community"},"name":"falcosidekick","namespace":"monitoring"},"spec":{"endpoints":[{"interval":"10s","path":"/metrics","port":"http","scheme":"http"}],"namespaceSelector":{"matchNames":["falcosidekick"]},"selector":{"matchLabels":{"app":"falcosidekick"}}}}
  labels:
    app: falcosidekick
    release: prometheus-community
  name: falcosidekick
  namespace: monitoring
spec:
