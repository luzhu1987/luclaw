# kube-prometheus-stack Helm Chart
# chart: prometheus-community/kube-prometheus-stack

# 全局镜像策略（本地网络优化）
global:
  imagePullSecrets: []
  pullPolicy: IfNotPresent

# Prometheus Operator
prometheus-operator:
  image:
    repository: docker.m.daocloud.io/quay.io/prometheus-operator
  admissionWebhooks:
    enabled: false  # 本地环境禁用 admission webhooks

# Prometheus 配置
prometheus:
  prometheusSpec:
    retention: 7d
    replicas: 1
    scrapeInterval: 30s
    evaluationInterval: 30s
    # 自动发现 ServiceMonitor（需要标签 release: prometheus-community）
    serviceMonitorSelector:
      matchLabels:
        release: prometheus-community
    serviceMonitorNamespaceSelector: {}
    ruleSelector:
      matchLabels:
        release: prometheus-community
    # 禁用不需要的组件（本地环境）
    components:
      coreDns:
        enabled: true
      kubeApiServer:
        enabled: true
      kubelet:
        enabled: true
      kubeControllerManager:
        enabled: true
      kubeEtcd:
        enabled: true
      kubeScheduler:
        enabled: true
      kubeProxy:
        enabled: true
      kubeStateMetrics:
        enabled: true
      nodeExporter:
        enabled: true
      alertmanager:
        enabled: true

# Alertmanager
alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1

# Grafana 子 chart（禁用，使用独立部署）
grafana:
  enabled: false

# 镜像仓库覆盖
alertmanager:
  image:
    repository: docker.m.daocloud.io/quay.io/prometheus/alertmanager
  tag: v0.28.1
  pullPolicy: IfNotPresent

nodeExporter:
  image:
    repository: docker.m.daocloud.io/quay.io/prometheus/node-exporter
  tag: v1.8.2
  pullPolicy: IfNotPresent

kubeStateMetrics:
  image:
    repository: docker.m.daocloud.io/registry.k8s.io/kube-state-metrics
  imageTag: v2.14.0
  pullPolicy: IfNotPresent

prometheus:
  prometheusSpec:
    retention: 7d
