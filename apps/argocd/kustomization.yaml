apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-apps
  source:
    repoURL: https://cdn.jsdelivr.net/gh/luzhu1987/luclaw
    targetRevision: main
    path: apps/argocd/apps
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# App-of-Apps 入口（列出所有子应用）
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-apps-manifest
  namespace: argocd
  labels:
    argocd.argoproj.io/managed-by: argocd
data:
  apps.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: falco
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: cluster-apps
      source:
        repoURL: https://github.com/luzhu1987/luclaw.git
        path: apps/falco
        targetRevision: main
      destination:
        namespace: falco
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
    ---
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: falcosidekick
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: cluster-apps
      source:
        repoURL: https://github.com/luzhu1987/luclaw.git
        path: apps/falcosidekick
        targetRevision: main
      destination:
        namespace: falcosidekick
        server: https://kubernetes.default.svc
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
    ---
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: prometheus
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: cluster-apps
      source:
        repoURL: https://github.com/luzhu1987/luclaw.git
        path: apps/prometheus
        targetRevision: main
      destination:
        namespace: monitoring
        server: https://kubernetes.default.svc
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
    ---
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: grafana
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: cluster-apps
      source:
        repoURL: https://github.com/luzhu1987/luclaw.git
        path: apps/grafana
        targetRevision: main
      destination:
        namespace: monitoring
        server: https://kubernetes.default.svc
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
    ---
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: keycloak
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: cluster-apps
      source:
        repoURL: https://github.com/luzhu1987/luclaw.git
        path: apps/keycloak
        targetRevision: main
      destination:
        namespace: keycloak
        server: https://kubernetes.default.svc
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
