apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kafka

bases:
  - ../base

patches:
  # Override external host for your environment
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kafka-config
      data:
        EXTERNAL_HOST: "192.168.3.68"
