---
# Kafka KRaft mode - cp-kafka 7.9.0
# CLUSTER_ID: mSGCpHrKTZK__DF7Al11jw
#
# Key discovery: cp-kafka's ensure script calls
#   kafka-storage format --cluster-id=$CLUSTER_ID -c /etc/kafka/kafka.properties
# but the KRaft config lives at /etc/kafka/kraft/server.properties.
# Solution: main container entry command creates symlink first,
# then execs the original /etc/confluent/docker/run.
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
  labels:
    app.kubernetes.io/managed-by: ArgoCD
    app: kafka
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka
          image: docker.m.daocloud.io/confluentinc/cp-kafka:7.9.0
          imagePullPolicy: IfNotPresent
          # Override CMD to fix KRaft config path bug BEFORE running entrypoint
          command:
            - /bin/sh
            - -euc
            - |
              echo "[fixup] KRaft config bug workaround..."
              # K8s Service injects KAFKA_PORT env var; cp-kafka configure script
              # treats KAFKA_PORT as deprecated and exits 1. Unset it.
              unset KAFKA_PORT KAFKA_ZOOKEEPER_CONNECT
              # KRaft mode needs node.id; derive from StatefulSet pod suffix (kafka-N -> N)
              NODE_ID=$(echo "$POD_NAME" | rev | cut -d- -f1 | rev)
              export KAFKA_NODE_ID="$NODE_ID"
              echo "[fixup] KAFKA_NODE_ID=$KAFKA_NODE_ID (from POD_NAME=$POD_NAME)"
              mkdir -p /etc/kafka
              ln -nsf /etc/kafka/kraft/server.properties /etc/kafka/kafka.properties
              echo "[fixup] Symlink: $(ls -la /etc/kafka/kafka.properties)"
              echo "[fixup] Exec-ing original cp-kafka entry: $@"
              exec /etc/confluent/docker/run "$@"
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: CLUSTER_ID
              value: "mSGCpHrKTZK__DF7Al11jw"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(POD_NAME).kafka-headless:9092,CONTROLLER://$(POD_NAME).kafka-headless:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka-headless:9093,1@kafka-1.kafka-headless:9093,2@kafka-2.kafka-headless:9093"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 8
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: kafka-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: kafka
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
