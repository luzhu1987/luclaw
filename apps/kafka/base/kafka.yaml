---
# Kafka KRaft mode (no Zookeeper required) - Kafka 7.9.0+
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
  labels:
    app.kubernetes.io/managed-by: ArgoCD
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: kafka
  labels:
    app.kubernetes.io/managed-by: ArgoCD
data:
  # KRaft mode: Kafka 3.3+ embedded kraft
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_NODE_ID: "${KAFKA_NODE_ID}"
  # Controller quorum voters (3 nodes for HA)
  KAFKA_CONTROLLER_QUORUM_VOTERS: "${KAFKA_CONTROLLER_QUORUM_VOTERS}"
  KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094"
  KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka.kafka.svc.cluster.local:9092,EXTERNAL://${EXTERNAL_HOST}:9094"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LOG_DIRS: "/var/lib/kafka/data"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_LOG_RETENTION_BYTES: "1073741824"
  KAFKA_LOG_RETENTION_HOURS: "168"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  # KRaft cluster ID (generate with kafka-storage.sh random-uuid)
  KAFKA_CLUSTER_ID: "${KAFKA_CLUSTER_ID}"
  # Disable inter-broker security for simplicity
  KAFKA_SASL_ENABLED_MECHANISMS: ""
  KAFKA_AUTHORIZER_CLASS_NAME: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-init-scripts
  namespace: kafka
  labels:
    app.kubernetes.io/managed-by: ArgoCD
data:
  init-cluster-id.sh: |
    #!/bin/bash
    set -e
    if [ -z "$KAFKA_CLUSTER_ID" ]; then
      echo "Generating KAFKA_CLUSTER_ID..."
      CLUSTER_ID=$(/opt/kafka/bin/kafka-storage.sh random-uuid)
      echo "KAFKA_CLUSTER_ID=$CLUSTER_ID"
      # Write to a shared volume so other pods can read it
      echo "$CLUSTER_ID" > /shared/cluster-id
    else
      echo "$KAFKA_CLUSTER_ID" > /shared/cluster-id
    fi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
  labels:
    app.kubernetes.io/managed-by: ArgoCD
    app: kafka
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9092"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: init-kafka
          image: docker.m.daocloud.io/confluentinc/cp-kafka:7.9.0
          command:
            - sh
            - -c
            - |
              CLUSTER_ID_FILE="/shared/cluster-id"
              if [ -f "$CLUSTER_ID_FILE" ]; then
                CLUSTER_ID=$(cat $CLUSTER_ID_FILE)
              else
                CLUSTER_ID=$(/opt/kafka/bin/kafka-storage.sh random-uuid)
                echo "$CLUSTER_ID" > $CLUSTER_ID_FILE
              fi
              echo "Using cluster ID: $CLUSTER_ID"
              NODE_ID=${HOSTNAME##*-}
              echo "Node ID: $NODE_ID"
              QUORUM=""
              for i in 0 1 2; do
                if [ -n "$QUORUM" ]; then QUORUM="$QUORUM,"; fi
                QUORUM="${QUORUM}${i}@kafka-$i.kafka-headless.kafka.svc.cluster.local:9093"
              done
              echo "Controller quorum: $QUORUM"
              /opt/kafka/bin/kafka-storage.sh format -t $CLUSTER_ID -c /opt/kafka/etc/kafka/kraft/server.properties --ignore-formatted --node-id $NODE_ID 2>/dev/null || true
          volumeMounts:
            - name: shared-data
              mountPath: /shared
            - name: kafka-config-template
              mountPath: /opt/kafka/etc/kafka
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
      containers:
        - name: kafka
          image: docker.m.daocloud.io/confluentinc/cp-kafka:7.9.0
          ports:
            - name: kafka-plain
              containerPort: 9092
              protocol: TCP
            - name: kafka-controller
              containerPort: 9093
              protocol: TCP
            - name: kafka-external
              containerPort: 9094
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: EXTERNAL_HOST
              value: "kafka.lu1987.cn"
            - name: KAFKA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['statefulset.kubernetes.io/pod-name']
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(POD_NAME).kafka-headless.$(POD_NAMESPACE).svc.cluster.local:9092,EXTERNAL://$(HOST_IP):$(grep -oP '(?<=EXTERNAL://0.0.0.0:)\d+' /etc/kafka/server.properties 2>/dev/null || echo 9094)"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka-headless.kafka.svc.cluster.local:9093,1@kafka-1.kafka-headless.kafka.svc.cluster.local:9093,2@kafka-2.kafka-headless.kafka.svc.cluster.local:9093"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_JMX_PORT
              value: "9999"
            - name: KAFKA_JMX_HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: shared-data
          emptyDir: {}
        - name: kafka-data
          emptyDir: {}
        - name: kafka-config-template
          configMap:
            name: kafka-config
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
  labels:
    app.kubernetes.io/managed-by: ArgoCD
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: kafka-plain
      port: 9092
      targetPort: 9092
      protocol: TCP
    - name: kafka-controller
      port: 9093
      targetPort: 9093
      protocol: TCP
---
# Headless service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: kafka
  labels:
    app.kubernetes.io/managed-by: ArgoCD
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: kafka-plain
      port: 9092
      targetPort: 9092
      protocol: TCP
    - name: kafka-external
      port: 9094
      targetPort: 9094
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  namespace: kafka
  labels:
    app.kubernetes.io/managed-by: ArgoCD
spec:
  type: NodePort
  selector:
    app: kafka
  ports:
    - name: kafka-external
      port: 9094
      targetPort: 9094
      nodePort: 30092
      protocol: TCP
