---
# Kafka KRaft mode (Kafka 7.9.0+, no Zookeeper)
# Cluster ID: Evj7k1AnToKcVP2+yFBGKA
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
  labels:
    app.kubernetes.io/managed-by: ArgoCD
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-scripts
  namespace: kafka
  labels:
    app.kubernetes.io/managed-by: ArgoCD
data:
  init.sh: |
    #!/bin/bash
    set -e
    CLUSTER_ID="Evj7k1AnToKcVP2+yFBGKA"
    NODE_ID=${HOSTNAME##*-}
    DATA_DIR="/var/lib/kafka/data"
    echo "[init] Formatting Kafka storage node=$NODE_ID cluster=$CLUSTER_ID"
    # Only format if not already formatted
    if ! /opt/kafka/bin/kafka-storage.sh info -d $DATA_DIR &>/dev/null; then
      /opt/kafka/bin/kafka-storage.sh format \
        -t $CLUSTER_ID \
        -c /opt/kafka/etc/kafka/kraft/server.properties \
        --ignore-formatted \
        --node-id $NODE_ID
      echo "[init] Format complete for node=$NODE_ID"
    else
      echo "[init] Storage already formatted for node=$NODE_ID"
    fi
---
apiVersion: v1
kind: Secret
metadata:
  name: kafka-secret
  namespace: kafka
  labels:
    app.kubernetes.io/managed-by: ArgoCD
type: Opaque
stringData:
  CLUSTER_ID: "Evj7k1AnToKcVP2+yFBGKA"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
  labels:
    app.kubernetes.io/managed-by: ArgoCD
    app: kafka
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  serviceName: kafka-headless
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
  template:
    metadata:
      labels:
        app: kafka
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9092"
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: init-kafka
          image: docker.m.daocloud.io/confluentinc/cp-kafka:7.9.0
          command: ["/bin/bash", "/scripts/init.sh"]
          env:
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: kafka-secret
                  key: CLUSTER_ID
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: kafka-scripts
              mountPath: /scripts
            - name: data
              mountPath: /var/lib/kafka/data
      containers:
        - name: kafka
          image: docker.m.daocloud.io/confluentinc/cp-kafka:7.9.0
          ports:
            - name: kafka-internal
              containerPort: 9092
            - name: kafka-ctrl
              containerPort: 9093
            - name: kafka-external
              containerPort: 9094
          env:
            # KRaft config
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['controller.kubernetes.io/pod-name']
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: kafka-secret
                  key: CLUSTER_ID
            # Listeners
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(POD_NAME).kafka-headless.$(POD_NAMESPACE).svc.cluster.local:9092,EXTERNAL://$(HOST_IP):9094"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka-headless.kafka.svc.cluster.local:9093,1@kafka-1.kafka-headless.kafka.svc.cluster.local:9093,2@kafka-2.kafka-headless.kafka.svc.cluster.local:9093"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "1073741824"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_JMX_PORT
              value: "9999"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: kafka-scripts
          configMap:
            name: kafka-scripts
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
  labels:
    app.kubernetes.io/managed-by: ArgoCD
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: kafka-internal
      port: 9092
      targetPort: 9092
    - name: kafka-external
      port: 9094
      targetPort: 9094
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: kafka
  labels:
    app.kubernetes.io/managed-by: ArgoCD
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: kafka-internal
      port: 9092
      targetPort: 9092
    - name: kafka-external
      port: 9094
      targetPort: 9094
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  namespace: kafka
  labels:
    app.kubernetes.io/managed-by: ArgoCD
spec:
  type: NodePort
  selector:
    app: kafka
  ports:
    - name: kafka-external
      port: 9094
      targetPort: 9094
      nodePort: 30092
