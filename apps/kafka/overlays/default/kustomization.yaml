apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kafka
resources:
  - ../../base
commonLabels:
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/part-of: kafka
patches:
  - target:
      kind: Deployment
      name: kafka-ui
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
